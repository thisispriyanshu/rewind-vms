[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewind-agents"
version = "0.1.0"
description = "Version control and a staging environment for AI agents: checkpoint, branch, and rewind agent state."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Priyanshu Agrawal" }]
keywords = ["ai", "agents", "memory", "checkpoint", "versioning", "cockroachdb", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/priyanshuagrawal/rewind"

[tool.hatch.build.targets.wheel]
packages = ["src/rewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
